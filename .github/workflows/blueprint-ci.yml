name: Blueprint checks
on:
  push:
  pull_request:
jobs:
  contracts-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run test:sketch-unit
      - run: python3 scripts/generate_contracts.py --check
      - run: python3 -m unittest discover -s packages/cad-store/tests -v
      - run: python3 scripts/verify_blueprint.py
      - run: python3 scripts/audit_next_milestones.py

  native-occt-and-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native OpenCascade binding
        run: python -m pip install --disable-pip-version-check -e packages/cad-geometry-python
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JSON Schema validator for cross-runtime parity
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.21,<5'
      - name: Validate sketch samples against Draft 2020-12 JSON Schema
        run: python scripts/check_sketch_schema.py
      - name: JS/schema/native cross-runtime contract regression
        run: python scripts/check_contract_parity.py
      - name: OCCT geometry and independent STEP roundtrip tests
        run: PYTHONPATH=packages/cad-geometry-python/src python -m unittest discover -s packages/cad-geometry-python/tests -v
      - name: Generate real STEP + evidence report
        run: |
          PYTHONPATH=packages/cad-geometry-python/src python -m cad_geometry.cli run \
            samples/precision-block.cad.json \
            --step /tmp/precision-block.step \
            --report /tmp/precision-block.evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: cad-004-005-step-evidence
          path: |
            /tmp/precision-block.step
            /tmp/precision-block.evidence.json
          if-no-files-found: error

  wasm-worker-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned WASM and browser app dependencies
        run: npm install --no-audit --no-fund
      - name: Pure worker runtime tests (no mocked precision claim)
        run: npm run test:worker-unit
      - name: Real planegcs WASM sketch constraint regression
        run: npm run test:sketch-wasm
      - name: Real OCCT WASM in Node Worker; numerical native parity
        run: WASM_STEP_OUTPUT=/tmp/wasm-precision.step npm run test:wasm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent native STEP reader
        run: python -m pip install --disable-pip-version-check -e packages/cad-geometry-python
      - name: Independent native OCCT STEP re-import of WASM-generated file
        run: PYTHONPATH=packages/cad-geometry-python/src python scripts/verify_wasm_step_with_native.py /tmp/wasm-precision.step
      - name: Production bundle build
        run: npm run build:studio
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser dedicated-worker Playwright E2E
        run: npm run test:browser
      - name: Browser real planegcs sketch + OCCT B-Rep Playwright E2E
        run: npm run test:sketch-browser
