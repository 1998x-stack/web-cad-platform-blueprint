<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD-007 · Precise Profile Extrusion</title><style>body{background:#101a2c;color:#f2f6ff;font:16px system-ui;margin:0;padding:26px;max-width:950px;margin-inline:auto}h1{font-size:26px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:740px){main{grid-template-columns:1fr}}section{background:#1d2b41;border:1px solid #3b506d;border-radius:12px;padding:18px}input,select,button{background:#293e5c;color:#fff;border:1px solid #708cb0;border-radius:5px;padding:8px;margin:5px}svg{background:#101c2f;width:100%;height:300px}pre{white-space:pre-wrap;word-break:break-word;color:#b9ddfa}button:disabled{opacity:.5}</style></head><body><h1>CAD-007｜精确封闭轮廓拉伸</h1><p>PlaneGCS → XY Profile → OCCT Wire → Face → Extrude。无孔、单闭环线段演示。</p><main><section><label>草图 <select id="preset"><option value="triangle">三角形</option><option value="rotated">旋转矩形</option><option value="concave">凹 L 形</option></select></label><label>厚度（mm）<input id="depth" type="number" min="0.1" max="1000" value="10" step="1"></label><p><button id="build">求解 + 拉伸</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="export">导出 STEP</button></p><svg id="profile-svg" viewBox="0 0 350 300" role="img" aria-label="平面草图轮廓"></svg><p id="status">等待 Worker 初始化</p></section><section><h2>内核证据</h2><pre id="metrics"></pre><h3>设计历史</h3><pre id="history"></pre></section></main><script type="module" src="./src/profile-main.mjs"></script></body></html>
