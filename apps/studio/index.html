<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Web CAD · WASM P0 Engineering Demo</title></head>
<body><main class="layout"><aside class="sidebar"><h1>Web CAD <span>实验工作台</span></h1><p class="sub">精确 OCCT B-Rep · 运行于 Dedicated Web Worker</p><h2>参数控制</h2><label for="hole">孔半径 (mm)</label><input id="hole" type="number" min="1" max="20" value="4" step="1"/><button id="rebuild">重建实体</button><button id="radius6">切换至 6 mm</button><button id="export">导出 STEP</button><button id="dispose">释放几何</button><div class="report"><h2>几何证据</h2><pre id="metrics">等待 WASM 初始化…</pre></div><p id="status" role="status">初始化中</p><small>本工作台仅验证 P0 的 Box、Cylinder、Boolean 与 STEP，不包含草图求解、装配和生产编辑器。</small></aside><section class="stage"><div class="stage-header">3D VIEWPORT <span id="indicator">Worker: starting</span></div><div id="viewport"></div><div class="stage-footer">鼠标拖动：旋转 · 滚轮：缩放 · 单位：mm</div></section></main><script type="module" src="/src/main.mjs"></script></body></html>
