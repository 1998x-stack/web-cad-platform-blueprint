[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-cad-geometry-spike"
version = "0.1.0"
description = "OCCT B-Rep and STEP round trip reference implementation for CAD-004/005"
requires-python = ">=3.11,<3.14"
dependencies = ["cadquery-ocp==7.9.3.1.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
